services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.38.0
    command: ["azurite", "--blobHost", "0.0.0.0", "--location", "/data", "--disableTelemetry"]
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(10000,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  azurite_data:
