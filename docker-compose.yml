services:
  frontend:
    build:
      context: ./Enterprise Compliance Platform
      dockerfile: Dockerfile
      args:
        VITE_ENTRA_CLIENT_ID: ${VITE_ENTRA_CLIENT_ID:?Set VITE_ENTRA_CLIENT_ID in the root .env file}
        VITE_ENTRA_AUTHORITY: ${VITE_ENTRA_AUTHORITY:?Set VITE_ENTRA_AUTHORITY in the root .env file}
        VITE_ENTRA_API_SCOPE: ${VITE_ENTRA_API_SCOPE:?Set VITE_ENTRA_API_SCOPE in the root .env file}
        VITE_ENTRA_REDIRECT_URI: ${VITE_ENTRA_REDIRECT_URI:-}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:80"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:3001}
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./NodejsBackend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      # Local/dev defaults only. Production MUST override DATABASE_URL (and
      # POSTGRES_PASSWORD below) from secrets — never ship these literals.
      # No JWT_SECRET: authentication is provider-managed (Entra ID); no
      # application secret exists to configure.
      DATABASE_URL: ${DATABASE_URL:-postgresql://ghe_user:ghe_password@db:5432/ghe_compliance?schema=public}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      OIDC_AUTHORITY: ${OIDC_AUTHORITY:?Set OIDC_AUTHORITY in the root .env file}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID in the root .env file}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?Set OIDC_AUDIENCE in the root .env file}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-false}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ghe_compliance}
      POSTGRES_USER: ${POSTGRES_USER:-ghe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghe_password}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads:
