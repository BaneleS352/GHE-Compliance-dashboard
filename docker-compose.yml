services:
  frontend:
    build:
      context: ./Enterprise Compliance Platform
      dockerfile: Dockerfile
      args:
        VITE_ENTRA_CLIENT_ID: ${VITE_ENTRA_CLIENT_ID:?Set VITE_ENTRA_CLIENT_ID in the root .env file}
        VITE_ENTRA_AUTHORITY: ${VITE_ENTRA_AUTHORITY:?Set VITE_ENTRA_AUTHORITY in the root .env file}
        VITE_ENTRA_API_SCOPE: ${VITE_ENTRA_API_SCOPE:?Set VITE_ENTRA_API_SCOPE in the root .env file}
        VITE_ENTRA_REDIRECT_URI: ${VITE_ENTRA_REDIRECT_URI:-}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:80"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:3001}
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: ghe-compliance-backend:local
    build:
      context: ./NodejsBackend
      dockerfile: Dockerfile
      args:
        PIP_CA_CERT_BASE64: ${PIP_CA_CERT_BASE64:-}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      # Compose deployment must provide this URL from an explicit secret.
      # No JWT_SECRET: authentication is provider-managed (Entra ID); no
      # application secret exists to configure.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL from a deployment secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      OIDC_AUTHORITY: ${OIDC_AUTHORITY:?Set OIDC_AUTHORITY in the root .env file}
      OIDC_ALLOWED_CLIENT_IDS: ${OIDC_ALLOWED_CLIENT_IDS:?Set comma-separated SPA client IDs in the root .env file}
      OIDC_REQUIRED_SCOPE: ${OIDC_REQUIRED_SCOPE:?Set the delegated API scope name in the root .env file}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?Set OIDC_AUDIENCE in the root .env file}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-false}
      EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EMAIL_WORKER_POLL_INTERVAL_MS: ${EMAIL_WORKER_POLL_INTERVAL_MS:-5000}
      EMAIL_WORKER_BATCH_SIZE: ${EMAIL_WORKER_BATCH_SIZE:-10}
      EMAIL_WORKER_LOCK_TIMEOUT_MS: ${EMAIL_WORKER_LOCK_TIMEOUT_MS:-900000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12

  email-worker:
    image: ghe-compliance-backend:local
    profiles: ["email"]
    entrypoint: ["/app/entrypoint.sh"]
    environment:
      APP_ROLE: email-worker
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL from a deployment secret}
      OIDC_AUTHORITY: ${OIDC_AUTHORITY:?Set OIDC_AUTHORITY in the root .env file}
      OIDC_ALLOWED_CLIENT_IDS: ${OIDC_ALLOWED_CLIENT_IDS:?Set comma-separated SPA client IDs in the root .env file}
      OIDC_REQUIRED_SCOPE: ${OIDC_REQUIRED_SCOPE:?Set the delegated API scope name in the root .env file}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?Set OIDC_AUDIENCE in the root .env file}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EMAIL_WORKER_POLL_INTERVAL_MS: ${EMAIL_WORKER_POLL_INTERVAL_MS:-5000}
      EMAIL_WORKER_BATCH_SIZE: ${EMAIL_WORKER_BATCH_SIZE:-10}
      EMAIL_WORKER_LOCK_TIMEOUT_MS: ${EMAIL_WORKER_LOCK_TIMEOUT_MS:-900000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ghe_compliance}
      POSTGRES_USER: ${POSTGRES_USER:-ghe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD from a deployment secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads:
