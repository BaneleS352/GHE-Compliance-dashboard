# Local testing only. This overlay provides an isolated test identity provider
# and enables the quick-login control in the frontend image.
services:
  frontend:
    build:
      args:
        VITE_ENTRA_CLIENT_ID: docker-test-client
        VITE_ENTRA_AUTHORITY: http://test-idp:55439
        VITE_ENTRA_API_SCOPE: ghe-test-api-audience
        VITE_ENTRA_REDIRECT_URI: http://localhost:3002
        VITE_ENABLE_TEST_LOGIN: "true"
    environment:
      TEST_IDP_URL: http://test-idp:55439
    depends_on:
      - backend
      - test-idp

  backend:
    environment:
      NODE_ENV: development
      OIDC_AUTHORITY: http://test-idp:55439
      OIDC_ISSUER: http://test-idp:55439
      OIDC_ALLOWED_CLIENT_IDS: docker-test-client
      OIDC_REQUIRED_SCOPE: access_as_user
      OIDC_AUDIENCE: ghe-test-api-audience
      GHE_TEST_IDENTITY_SEED: "true"
      SEED_ON_BOOT: "true"
    depends_on:
      db:
        condition: service_healthy
      test-idp:
        condition: service_started

  test-idp:
    build:
      context: ./NodejsBackend
      dockerfile: Dockerfile
      args:
        PIP_CA_CERT_BASE64: ${PIP_CA_CERT_BASE64:-}
    entrypoint: ["node"]
    command: ["dist/scripts/test-provider.js"]
    environment:
      TEST_JWKS_PORT: 55439
      TEST_JWKS_BIND_HOST: 0.0.0.0
      TEST_JWKS_ISSUER: http://test-idp:55439
      TEST_JWKS_CLIENT_ID: docker-test-client
    expose:
      - "55439"
    restart: unless-stopped
