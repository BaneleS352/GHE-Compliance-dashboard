<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rand Value Field</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 15px;
      background: #fff;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
    }

    .field {
      width: 100%;
    }

    .field__label {
      display: block;
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
    }

    .field__help {
      margin: 0 0 7px;
      color: #333;
      font-size: 12px;
      line-height: 1.25;
    }

    .field__input {
      display: block;
      width: 100%;
      height: 50px;
      padding: 0 15px;
      border: 2px solid #c55aff;
      border-radius: 17px;
      outline: 0;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(215, 103, 255, .19);
      color: #171717;
      font: 700 16px/1 Arial, Helvetica, sans-serif;
      transition: border-color .15s, box-shadow .15s;
    }

    .field__input:focus {
      border-color: #b62dff;
      box-shadow: 0 0 0 4px rgba(215, 103, 255, .24);
    }

    .field__error {
      display: flex;
      align-items: center;
      min-height: 52px;
      margin-top: 18px;
      padding: 13px 17px;
      border: 2px solid #ff918b;
      border-radius: 17px 17px 0 0;
      background: linear-gradient(90deg, #ffe8e4 0%, #ffd8d4 100%);
      color: #bd2826;
      font-size: 14px;
      line-height: 1.35;
    }

    .field__error-icon {
      width: 17px;
      height: 17px;
      margin-right: 12px;
      flex: 0 0 auto;
    }

    @media (max-width: 520px) {
      body { padding: 12px; }
      .field__error { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="field">
    <label class="field__label" for="rand-value">
      Rand Value of Equivalent Rand Value (Including VAT)
    </label>
    <p class="field__help" id="rand-value-help">
      Enter the Rand value including VAT. Convert foreign currency to ZAR equivalent.
    </p>

    <input
      class="field__input"
      id="rand-value"
      name="randValue"
      type="text"
      inputmode="numeric"
      value="R1 000 001"
      aria-describedby="rand-value-help rand-value-error"
      aria-invalid="true"
      autofocus
    >

    <div class="field__error" id="rand-value-error" role="alert">
      <svg class="field__error-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <path d="M12 7.5v5.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="12" cy="16.7" r="1.2" fill="currentColor"/>
      </svg>
      <span>Maximum value exceeded. Please enter an amount of R1 000 000 or less to continue.</span>
    </div>
  </main>

  <script>
    const input = document.querySelector('#rand-value');
    const error = document.querySelector('#rand-value-error');
    const maximum = 1_000_000;

    function numericValue(value) {
      return Number(value.replace(/[^0-9]/g, ''));
    }

    function validate() {
      const isOverMaximum = numericValue(input.value) > maximum;
      input.setAttribute('aria-invalid', String(isOverMaximum));
      error.hidden = !isOverMaximum;
    }

    input.addEventListener('input', validate);
    validate();
  </script>
</body>
</html>
