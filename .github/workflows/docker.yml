name: Docker image validation

on:
  push:
    branches: [main, dev, "HS-*"]
    paths:
      - "docker-compose.yml"
      - "docker-compose.stub.yml"
      - ".env.docker-stub"
      - ".env.example"
      - ".dockerignore"
      - "NodejsBackend/Dockerfile"
      - "NodejsBackend/entrypoint.sh"
      - "NodejsBackend/requirements.txt"
      - "NodejsBackend/package.json"
      - "NodejsBackend/package-lock.json"
      - "NodejsBackend/prisma/**"
      - "NodejsBackend/src/**"
      - "Enterprise Compliance Platform/Dockerfile"
      - "Enterprise Compliance Platform/nginx.conf"
      - "Enterprise Compliance Platform/nginx.stub.conf"
      - "Enterprise Compliance Platform/package.json"
      - "Enterprise Compliance Platform/package-lock.json"
      - "Enterprise Compliance Platform/src/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - "docker-compose.stub.yml"
      - ".env.docker-stub"
      - ".env.example"
      - ".dockerignore"
      - "NodejsBackend/Dockerfile"
      - "NodejsBackend/entrypoint.sh"
      - "NodejsBackend/requirements.txt"
      - "NodejsBackend/package.json"
      - "NodejsBackend/package-lock.json"
      - "NodejsBackend/prisma/**"
      - "NodejsBackend/src/**"
      - "Enterprise Compliance Platform/Dockerfile"
      - "Enterprise Compliance Platform/nginx.conf"
      - "Enterprise Compliance Platform/nginx.stub.conf"
      - "Enterprise Compliance Platform/package.json"
      - "Enterprise Compliance Platform/package-lock.json"
      - "Enterprise Compliance Platform/src/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-images:
    name: Validate Docker Compose images
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        run: docker compose config --quiet
        env:
          VITE_ENTRA_CLIENT_ID: ci-client-id
          VITE_ENTRA_AUTHORITY: https://login.microsoftonline.com/ci-tenant
          VITE_ENTRA_API_SCOPE: api://ci-client-id/access_as_user
          VITE_ENTRA_REDIRECT_URI: http://localhost:3000
          OIDC_AUTHORITY: https://login.microsoftonline.com/ci-tenant/v2.0
          OIDC_CLIENT_ID: ci-client-id
          OIDC_AUDIENCE: api://ci-client-id

      - name: Build application images
        run: docker compose build --pull
        env:
          VITE_ENTRA_CLIENT_ID: ci-client-id
          VITE_ENTRA_AUTHORITY: https://login.microsoftonline.com/ci-tenant
          VITE_ENTRA_API_SCOPE: api://ci-client-id/access_as_user
          VITE_ENTRA_REDIRECT_URI: http://localhost:3000
          OIDC_AUTHORITY: https://login.microsoftonline.com/ci-tenant/v2.0
          OIDC_CLIENT_ID: ci-client-id
          OIDC_AUDIENCE: api://ci-client-id

      - name: Validate local stub Compose configuration
        run: docker compose -p ghe-compliance-stub --env-file .env.docker-stub -f docker-compose.yml -f docker-compose.stub.yml config --quiet

      - name: Build local stub images
        run: docker compose -p ghe-compliance-stub --env-file .env.docker-stub -f docker-compose.yml -f docker-compose.stub.yml build --pull

      - name: Start local stub stack
        run: docker compose -p ghe-compliance-stub --env-file .env.docker-stub -f docker-compose.yml -f docker-compose.stub.yml up -d --wait --wait-timeout 180

      - name: Smoke test stub identity and authenticated API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 60 --retry-delay 2 --retry-all-errors \
            http://localhost:3002/api/health
          curl --fail --silent --show-error \
            http://localhost:3002/__dev-auth/discovery/v2.0/keys | jq -e '.keys | length > 0'
          token="$(curl --fail --silent --show-error \
            -H 'content-type: application/json' \
            --data '{"email":"admin@hb.co.za","name":"Admin User","oid":"ci-docker-admin"}' \
            http://localhost:3002/__dev-auth/test-token)"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${token}" \
            http://localhost:3002/api/auth/me | jq -e '.email == "admin@hb.co.za" and .role == "admin"'

      - name: Show stub stack logs on failure
        if: failure()
        run: docker compose -p ghe-compliance-stub --env-file .env.docker-stub -f docker-compose.yml -f docker-compose.stub.yml logs

      - name: Stop stub stack
        if: always()
        run: docker compose -p ghe-compliance-stub --env-file .env.docker-stub -f docker-compose.yml -f docker-compose.stub.yml down -v
