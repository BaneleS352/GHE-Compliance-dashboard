name: Frontend checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Enterprise Compliance Platform
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Enterprise Compliance Platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run quality gate
        run: npm run quality

      - name: Run frontend tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify test authentication hook is absent from production bundle
        shell: bash
        run: |
          if grep -R -n -F 'e2e.auth.token' dist/assets; then
            echo "Test authentication token hook leaked into the production bundle."
            exit 1
          fi
