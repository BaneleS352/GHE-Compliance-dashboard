name: Playwright end-to-end checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    # Browser gate: Playwright drives the built UI against a real backend and
    # migrated PostgreSQL, using only the throwaway JWKS test provider.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AZURITE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ghe_e2e
          POSTGRES_USER: ghe_user
          POSTGRES_PASSWORD: ghe_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghe_user -d ghe_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.38.0
        ports:
          - 10000:10000
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install document-protection sidecars
        working-directory: NodejsBackend
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Install backend dependencies
        working-directory: NodejsBackend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: Enterprise Compliance Platform
        run: npm ci

      - name: Install Playwright browser
        working-directory: Enterprise Compliance Platform
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: Enterprise Compliance Platform
        run: npx playwright test --retries=0 --trace=retain-on-failure
        env:
          E2E_PG_DATABASE_URL: postgresql://ghe_user:ghe_password@localhost:5432/ghe_e2e?schema=public

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Enterprise Compliance Platform/playwright-report
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: Enterprise Compliance Platform/test-results
          retention-days: 14
          if-no-files-found: warn
