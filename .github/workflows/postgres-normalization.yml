name: postgres-normalization

on:
  push:
    paths:
      - "NodejsBackend/**"
      - "Enterprise Compliance Platform/src/**"
      - ".github/workflows/postgres-normalization.yml"
  pull_request:
    paths:
      - "NodejsBackend/**"
      - "Enterprise Compliance Platform/src/**"
      - ".github/workflows/postgres-normalization.yml"
  workflow_dispatch:

jobs:
  postgres-migration-views:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ghe_pg_test
          POSTGRES_USER: ghe_user
          POSTGRES_PASSWORD: ghe_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghe_user -d ghe_pg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: NodejsBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: NodejsBackend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run pg:test
        env:
          TEST_PG_DATABASE_URL: postgresql://ghe_user:ghe_password@localhost:5432/ghe_pg_test?schema=public

  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ghe_smoke
          POSTGRES_USER: ghe_user
          POSTGRES_PASSWORD: ghe_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghe_user -d ghe_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: NodejsBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: NodejsBackend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run pg:smoke
        env:
          SMOKE_PG_DATABASE_URL: postgresql://ghe_user:ghe_password@localhost:5432/ghe_smoke?schema=public

  frontend-typecheck-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Enterprise Compliance Platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Enterprise Compliance Platform/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
