name: Playwright end-to-end checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    # Browser gate: Playwright drives the built UI against a real backend and
    # migrated PostgreSQL, using only the throwaway JWKS test provider.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ghe_e2e
          POSTGRES_USER: ghe_user
          POSTGRES_PASSWORD: ghe_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghe_user -d ghe_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install document-protection sidecars
        working-directory: NodejsBackend
        run: pip3 install --no-cache-dir --break-system-packages -r requirements.txt

      - name: Install backend dependencies
        working-directory: NodejsBackend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: Enterprise Compliance Platform
        run: npm ci

      - name: Install Playwright browser
        working-directory: Enterprise Compliance Platform
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: Enterprise Compliance Platform
        run: npx playwright test
        env:
          E2E_PG_DATABASE_URL: postgresql://ghe_user:ghe_password@localhost:5432/ghe_e2e?schema=public
