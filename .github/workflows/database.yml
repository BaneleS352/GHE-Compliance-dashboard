name: PostgreSQL lifecycle

on:
  workflow_call:

permissions:
  contents: read

jobs:
  database:
    name: PostgreSQL integration and smoke checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ghe_user
          POSTGRES_PASSWORD: ghe_password
          POSTGRES_DB: ghe_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghe_user -d ghe_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: NodejsBackend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: NodejsBackend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run PostgreSQL integration checks
        run: npm run pg:test
        env:
          TEST_PG_DATABASE_URL: postgresql://ghe_user:ghe_password@localhost:5432/ghe_ci?schema=public

      - name: Run backend build
        run: npm run build

      - name: Run PostgreSQL smoke checks
        run: npm run pg:smoke
        env:
          SMOKE_PG_DATABASE_URL: postgresql://ghe_user:ghe_password@localhost:5432/ghe_ci?schema=public
