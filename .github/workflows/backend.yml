name: Backend checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    env:
      AZURITE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
      TEST_PG_DATABASE_URL: postgresql://ghe_user:ghe_password@localhost:5432/ghe_backend_test?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ghe_user
          POSTGRES_PASSWORD: ghe_password
          POSTGRES_DB: ghe_backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghe_user -d ghe_backend_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.38.0
        ports:
          - 10000:10000
    defaults:
      run:
        working-directory: NodejsBackend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: NodejsBackend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Python document-protection sidecars
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install document-protection dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Run backend tests
        run: npm test

      - name: Build backend
        run: npm run build
